name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JSON
        run: python3 -m json.tool schemas/v0.1/promotion.schema.json >/dev/null
      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f GOVERNANCE.md
          test -f CODE_OF_CONDUCT.md
          test -f spec/pri-v0.1.md
          test -f examples/hello-promotion.yaml

